<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Orders · Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin-ui.css?v=2">
</head>
<body>
  <div class="mobile-navbar">
    <button class="hamburger-btn" id="mobile-nav-toggle">&#9776;</button>
    <div class="brand">Store Orders</div>
    <div style="width:36px;"></div>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-head">
        <div>
          <h1>Store orders</h1>
          <div class="page-subtitle">Search, filter by status, and update fulfillment without leaving this table.</div>
        </div>
        <div class="flex gap-8">
          <button class="btn btn-secondary" type="button" id="bulk-delete-orders-btn">Delete selected</button>
          <button class="btn btn-danger" type="button" id="clear-orders-btn">Clear all orders</button>
        </div>
      </div>
      <div id="help-list" style="margin-bottom:24px;"></div>
      <div class="filter-bar">
        <input class="form-control" id="order-search" placeholder="Search name, product, order number, email…">
        <select class="form-control" id="order-status-filter" aria-label="Status filter">
          <option value="">All statuses</option>
          <option value="pending_payment">pending_payment</option>
          <option value="paid">paid</option>
          <option value="processing">processing</option>
          <option value="packed">packed</option>
          <option value="shipped">shipped</option>
          <option value="delivered">delivered</option>
          <option value="cancelled">cancelled</option>
          <option value="refunded">refunded</option>
        </select>
      </div>
      <div id="orders-list"></div>
    </main>
  </div>

  <div class="modal-overlay" id="order-modal">
    <div class="modal" style="max-width:720px;max-height:90vh;overflow:auto;">
      <div class="modal-header">
        <h3 id="order-modal-title">Order</h3>
        <button class="modal-close" type="button" onclick="closeModal('order-modal')">&times;</button>
      </div>
      <div id="order-modal-body" style="padding:16px;"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/nav-config.js?v=1"></script>
  <script src="js/shell.js?v=2"></script>
  <script src="js/admin-store-orders.js?v=8"></script>
</body>
</html>
