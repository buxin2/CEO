<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Checkout</title>
  <link rel="stylesheet" href="css/style.css?v=10">
  <link rel="stylesheet" href="css/storefront.css?v=1">
</head>
<body class="storefront store-body">
  <div class="sf-glow"></div>
  <header class="sf-bar">
    <a class="sf-brand" href="store.html">
      <span class="sf-brand-mark">S</span>
      <span class="sf-brand-text">
        <strong>Checkout</strong>
        <small>Card, PayPal, or Wave</small>
      </span>
    </a>
    <label class="sf-search-wrap">
      <a class="sf-pill" href="store.html" style="display:block;text-align:center;padding:12px;">← Continue shopping</a>
    </label>
    <div class="sf-bar-actions">
      <a class="sf-pill" href="store-account.html">Account</a>
      <a class="sf-cart" href="store-checkout.html" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
        <span class="store-cart-count" id="store-cart-count">0</span>
      </a>
    </div>
  </header>
  <div id="checkout-error" class="sf-error hidden" style="max-width:880px;margin:12px auto;"></div>
  <div class="store-checkout" id="checkout-root">
    <div class="empty-state"><span class="spinner"></span></div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/store-cart.js?v=6"></script>
  <script src="js/iso-countries.js?v=1"></script>
  <script src="js/paypal-buttons.js?v=1"></script>
  <script src="js/store-contact.js?v=1"></script>
  <script src="js/store-checkout.js?v=14"></script>
</body>
</html>
