<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Store</title>
  <meta name="description" content="Browse products, photos, and videos instantly.">
  <meta property="og:title" content="Store">
  <link rel="stylesheet" href="css/style.css?v=10">
  <link rel="stylesheet" href="css/storefront.css?v=1">
</head>
<body class="storefront">
  <div class="sf-glow"></div>
  <header class="sf-bar">
    <a class="sf-brand" href="store.html">
      <span class="sf-brand-mark" id="sf-brand-mark">S</span>
      <span class="sf-brand-text">
        <strong id="sf-brand-name">Store</strong>
        <small id="sf-brand-tag"></small>
      </span>
    </a>
    <label class="sf-search-wrap">
      <input id="store-search" type="search" placeholder="Search products" enterkeyhint="search" autocomplete="off">
    </label>
    <div class="sf-bar-actions">
      <a class="sf-pill" href="store-account.html">Account</a>
      <a class="sf-cart" href="store-checkout.html" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
        <span class="store-cart-count" id="store-cart-count">0</span>
      </a>
    </div>
  </header>
  <main class="sf-page">
    <div id="store-error" class="sf-error hidden"></div>
    <section class="sf-hero hidden" id="store-hero"></section>
    <div class="sf-cats" id="category-bar"></div>
    <div class="sf-grid" id="product-grid">
      <div class="sf-empty">Loading the store…</div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/store-cart.js?v=6"></script>
  <script src="js/store-static.js?v=1"></script>
  <script src="js/store-contact.js?v=1"></script>
  <script src="js/store.js?v=2"></script>
</body>
</html>
