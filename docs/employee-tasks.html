<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Person · My Management System</title>
  <link rel="stylesheet" href="css/style.css?v=17">
  <link rel="stylesheet" href="css/admin-ui.css?v=1">
</head>
<body>
  <div class="mobile-navbar">
    <button class="hamburger-btn" id="mobile-nav-toggle" aria-label="Open menu">☰</button>
    <div class="brand">My Management System</div>
    <button type="button" class="icon-btn" id="theme-toggle-btn" aria-label="Toggle color theme">◐</button>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <div class="breadcrumb" id="breadcrumb">
        <a href="dashboard.html">Dashboard</a> / <span id="breadcrumb-company">...</span> / <span id="breadcrumb-employee">...</span>
      </div>

      <div class="page-header">
        <div>
          <h1 id="employee-name">Loading...</h1>
          <div class="page-subtitle" id="employee-subtitle"></div>
        </div>
        <div class="flex gap-8">
          <button class="btn btn-secondary" id="copy-link-btn">Copy Task Link</button>
          <button class="btn btn-secondary" id="copy-last-week-btn">Copy Last Week</button>
          <button class="btn btn-primary" id="open-add-task-btn">+ Add Task</button>
        </div>
      </div>

      <div class="ui-tabs" id="person-tabs">
        <button type="button" class="active" data-person-tab="all">All tasks</button>
        <button type="button" data-person-tab="excel">Excel & leftover</button>
        <button type="button" data-person-tab="history">Progress history</button>
      </div>

      <div id="person-tab-all">
      <div class="week-nav">
        <button class="btn btn-secondary btn-sm" id="prev-week-btn">&larr; Previous Week</button>
        <span class="week-label" id="week-label">This week</span>
        <button class="btn btn-secondary btn-sm" id="next-week-btn">Next Week &rarr;</button>
        <button class="btn btn-ghost btn-sm" id="current-week-btn">Current Week</button>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <div class="progress-label"><span id="progress-text">0/0 completed</span><span id="progress-pct">0%</span></div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      </div>

      <div class="filter-tabs" id="status-filter-tabs">
        <button class="filter-tab active" data-value="all">All</button>
        <button class="filter-tab" data-value="pending">Pending</button>
        <button class="filter-tab" data-value="completed">Completed</button>
      </div>
      <div class="filter-tabs" id="priority-filter-tabs">
        <button class="filter-tab active" data-value="all">All Priorities</button>
        <button class="filter-tab" data-value="high">High</button>
        <button class="filter-tab" data-value="medium">Medium</button>
        <button class="filter-tab" data-value="low">Low</button>
      </div>
      </div>

      <div class="card hidden" id="excel-lists-card" style="margin-bottom:20px;">
        <h2 class="section-title">Excel tasks</h2>
        <p class="text-muted">Open a day to review only that day's work. Previous is leftover unfinished work. Edit to mark completed or not done.</p>
        <div id="leftover-box" class="ui-card" style="margin-bottom:16px;"></div>
        <div id="excel-lists-box"><p class="text-muted">Loading…</p></div>
      </div>
      <div class="ui-card hidden" id="history-card" style="margin-bottom:20px;">
        <h2 class="ui-section-title">Progress history</h2>
        <div id="history-box"></div>
      </div>

      <div id="tasks-container">
        <div class="empty-state"><span class="spinner"></span></div>
      </div>

      <div class="modal-overlay" id="task-modal">
        <div class="modal">
          <div class="modal-header">
            <h3 id="task-modal-title">Add Task</h3>
            <button class="modal-close" onclick="closeModal('task-modal')">&times;</button>
          </div>
          <form id="task-form">
            <input type="hidden" id="task-id">
            <div class="form-group">
              <label class="form-label" for="task-title">Task Title</label>
              <input class="form-control" id="task-title" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="task-description">Description</label>
              <textarea class="form-control" id="task-description" placeholder="Optional"></textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="task-priority">Priority</label>
                <select class="form-control" id="task-priority">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="task-due-date">Due Date</label>
                <input class="form-control" type="date" id="task-due-date">
              </div>
            </div>
            <div class="form-error" id="task-form-error"></div>
            <div class="form-actions">
              <button type="button" class="btn btn-secondary" onclick="closeModal('task-modal')">Cancel</button>
              <button type="submit" class="btn btn-primary" id="task-form-submit">Create Task</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/nav-config.js?v=1"></script>
  <script src="js/shell.js?v=2"></script>
  <script src="js/work-list-ui.js?v=4"></script>
  <script>
    const EMPLOYEE_ID = getQueryParam("id");
    if (!EMPLOYEE_ID) {
      window.location.href = pageUrl("dashboard.html");
    }

    let EMPLOYEE_TOKEN = "";
    let COMPANY_ID = null;
    let currentWeekStart = null;
    let currentWeekEnd = null;
    let statusFilter = "all";
    let priorityFilter = "all";

    async function loadEmployeeMeta() {
      const data = await apiRequest(`/api/employees/${EMPLOYEE_ID}`);
      EMPLOYEE_TOKEN = data.unique_token;
      COMPANY_ID = data.company_id;
      document.getElementById("employee-name").textContent = data.name;
      document.getElementById("breadcrumb-employee").textContent = data.name;
      document.getElementById("breadcrumb-company").innerHTML =
        `<a href="company.html?id=${data.company_id}">${escapeHtml(data.company_name)}</a>`;
      document.getElementById("employee-subtitle").textContent =
        data.company_name + (data.position ? " · " + data.position : "");
    }

    async function loadTasks(weekStart) {
      const container = document.getElementById("tasks-container");
      container.innerHTML = '<div class="empty-state"><span class="spinner"></span></div>';

      let url = `/api/employees/${EMPLOYEE_ID}/tasks?status=${statusFilter}&priority=${priorityFilter}`;
      if (weekStart) url += "&week_start=" + weekStart;

      try {
        const data = await apiRequest(url);
        currentWeekStart = data.week.week_start;
        currentWeekEnd = data.week.week_end;

        document.getElementById("week-label").textContent = formatDateRange(data.week.week_start, data.week.week_end);
        document.getElementById("prev-week-btn").onclick = () => loadTasks(data.week.prev_week_start);
        document.getElementById("next-week-btn").onclick = () => loadTasks(data.week.next_week_start);
        document.getElementById("current-week-btn").onclick = () => loadTasks(null);

        const stats = data.stats;
        document.getElementById("progress-text").textContent = `${stats.completed}/${stats.total} completed`;
        document.getElementById("progress-pct").textContent = stats.completion_pct + "%";
        const fill = document.getElementById("progress-fill");
        fill.style.width = stats.completion_pct + "%";
        fill.classList.toggle("success", stats.completion_pct >= 100);

        renderTasks(data.tasks);
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><p>${escapeHtml(err.message)}</p></div>`;
      }
    }

    function renderTasks(tasks) {
      const container = document.getElementById("tasks-container");

      if (!tasks.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">&#128203;</div>
            <p>No tasks assigned for this week.</p>
            <button class="btn btn-primary" onclick="openAddTask()">+ Add Task</button>
          </div>`;
        return;
      }

      container.innerHTML = tasks.map(renderTaskRow).join("");
    }

    function renderTaskRow(t) {
      const dueLabel = t.due_date ? formatShortDate(t.due_date) : "No due date";
      return `
        <div class="task-row">
          <div class="task-row-main">
            <div class="task-row-title ${t.status === "completed" ? "completed" : ""}">${escapeHtml(t.title)}</div>
            ${t.description ? `<div class="task-row-desc">${escapeHtml(t.description)}</div>` : ""}
            <div class="task-row-meta">
              <span class="badge badge-priority-${t.priority}">${t.priority}</span>
              <span class="badge badge-status-${t.status}">${t.status}</span>
              <span>Due: ${dueLabel}</span>
            </div>
          </div>
          <div class="task-row-actions">
            <button class="btn btn-secondary btn-sm" onclick='openEditTask(${JSON.stringify(t).replace(/'/g, "&apos;")})'>Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteTask(${t.id})">Delete</button>
          </div>
        </div>`;
    }

    function openAddTask() {
      document.getElementById("task-modal-title").textContent = "Add Task";
      document.getElementById("task-form-submit").textContent = "Create Task";
      document.getElementById("task-id").value = "";
      document.getElementById("task-title").value = "";
      document.getElementById("task-description").value = "";
      document.getElementById("task-priority").value = "medium";
      document.getElementById("task-due-date").value = "";
      document.getElementById("task-form-error").classList.remove("visible");
      openModal("task-modal");
    }

    function openEditTask(t) {
      document.getElementById("task-modal-title").textContent = "Edit Task";
      document.getElementById("task-form-submit").textContent = "Save Changes";
      document.getElementById("task-id").value = t.id;
      document.getElementById("task-title").value = t.title;
      document.getElementById("task-description").value = t.description || "";
      document.getElementById("task-priority").value = t.priority;
      document.getElementById("task-due-date").value = t.due_date || "";
      document.getElementById("task-form-error").classList.remove("visible");
      openModal("task-modal");
    }

    async function deleteTask(id) {
      if (!confirm("Delete this task? This cannot be undone.")) return;
      try {
        await apiRequest(`/api/tasks/${id}`, { method: "DELETE" });
        showToast("Task deleted");
        loadTasks(currentWeekStart);
      } catch (err) {
        showToast(err.message);
      }
    }

    document.getElementById("open-add-task-btn").addEventListener("click", openAddTask);

    document.getElementById("task-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("task-form-error");
      errorBox.classList.remove("visible");

      const id = document.getElementById("task-id").value;
      const payload = {
        title: document.getElementById("task-title").value.trim(),
        description: document.getElementById("task-description").value.trim(),
        priority: document.getElementById("task-priority").value,
        due_date: document.getElementById("task-due-date").value || null,
      };

      try {
        if (id) {
          await apiRequest(`/api/tasks/${id}`, { method: "PUT", body: JSON.stringify(payload) });
        } else {
          payload.week_start = currentWeekStart;
          await apiRequest(`/api/employees/${EMPLOYEE_ID}/tasks`, { method: "POST", body: JSON.stringify(payload) });
        }
        closeModal("task-modal");
        loadTasks(currentWeekStart);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add("visible");
      }
    });

    document.getElementById("copy-link-btn").addEventListener("click", () => {
      if (!EMPLOYEE_TOKEN) return;
      copyToClipboard(taskLinkForToken(EMPLOYEE_TOKEN)).then(() => showToast("Task link copied!"));
    });

    document.getElementById("copy-last-week-btn").addEventListener("click", async () => {
      try {
        await apiRequest(`/api/employees/${EMPLOYEE_ID}/copy-last-week`, {
          method: "POST",
          body: JSON.stringify({ week_start: currentWeekStart }),
        });
        showToast("Last week's tasks copied");
        loadTasks(currentWeekStart);
      } catch (err) {
        showToast(err.message);
      }
    });

    function setupFilterTabs(containerId, onChange) {
      const container = document.getElementById(containerId);
      container.querySelectorAll(".filter-tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          container.querySelectorAll(".filter-tab").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          onChange(btn.dataset.value);
        });
      });
    }

    setupFilterTabs("status-filter-tabs", (val) => { statusFilter = val; loadTasks(currentWeekStart); });
    setupFilterTabs("priority-filter-tabs", (val) => { priorityFilter = val; loadTasks(currentWeekStart); });

    document.getElementById("person-tabs").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-person-tab]");
      if (!btn) return;
      const tab = btn.getAttribute("data-person-tab");
      document.querySelectorAll("#person-tabs [data-person-tab]").forEach((b) => b.classList.toggle("active", b === btn));
      document.getElementById("person-tab-all").classList.toggle("hidden", tab !== "all");
      document.getElementById("excel-lists-card").classList.toggle("hidden", tab !== "excel");
      document.getElementById("history-card").classList.toggle("hidden", tab !== "history");
      document.getElementById("tasks-container").classList.toggle("hidden", tab !== "all");
    });

    const empWorkState = {};
    let personExcelRows = [];

    function paintEmpWorkBlock(host, w, rows) {
      const today = localTodayIso();
      const progress = workMergedProgress(rows, [w], w.progress, today);
      const prev = empWorkState[w.id] && empWorkState[w.id].view;
      const editing = !!(empWorkState[w.id] && empWorkState[w.id].editing);
      const view = workDefaultView(progress, today, prev);
      empWorkState[w.id] = { view, rows, list: w, editing };
      const visible = workFilterRows(rows, view, today);
      host.innerHTML = `
        <div class="flex gap-8 flex-wrap" style="margin-bottom:8px;align-items:center;">
          <p style="margin:0;"><strong>${escapeHtml(w.filename)}</strong> · ${w.daily_quota} tasks/day</p>
          <button type="button" class="btn btn-secondary btn-sm" data-work-toggle-edit="${w.id}">${editing ? "Done" : "Edit"}</button>
        </div>
        ${workDeskHtml(progress, view, today, rows)}
        ${visible.length ? visible.map((r) => workRowCardHtml(r, today, { editing })).join("") : workEmptyMessage(view)}
      `;
      bindWorkDayTabs(host, (next) => {
        empWorkState[w.id].view = next;
        paintEmpWorkBlock(host, w, rows);
      }, view);
      const editBtn = host.querySelector("[data-work-toggle-edit]");
      if (editBtn) {
        editBtn.addEventListener("click", () => {
          empWorkState[w.id].editing = !empWorkState[w.id].editing;
          paintEmpWorkBlock(host, w, rows);
        });
      }
      bindWorkAdminEdits(host, w.id, rows, () => paintEmpWorkBlock(host, w, rows));
    }

    async function loadExcelLists() {
      const box = document.getElementById("excel-lists-box");
      if (!box || !COMPANY_ID) return;
      try {
        const data = await apiRequest(`/api/companies/${COMPANY_ID}/work-lists?employee_id=${EMPLOYEE_ID}`);
        const lists = data.work_lists || [];
        if (!lists.length) {
          box.innerHTML = "<p class=\"text-muted\">No Excel list for this employee yet. Upload one on the company page.</p>";
          document.getElementById("leftover-box").innerHTML = `<div class="empty-lite">No leftover tasks.</div>`;
          document.getElementById("history-box").innerHTML = `<div class="empty-lite">No dated Excel work yet.</div>`;
          return;
        }
        box.innerHTML = lists.map((w) => `<div data-emp-work="${w.id}"></div>`).join("");
        personExcelRows = [];
        const today = localTodayIso();
        for (const w of lists) {
          const host = box.querySelector('[data-emp-work="' + w.id + '"]');
          const rowsData = await apiRequest("/api/work-lists/" + w.id + "/rows");
          const rows = rowsData.rows || [];
          personExcelRows = personExcelRows.concat(rows);
          paintEmpWorkBlock(host, rowsData.work_list || w, rows);
        }
        const leftover = personExcelRows.filter((r) => {
          const day = String(r.assigned_date || "").slice(0, 10);
          return day && day < today && String(r.status).toLowerCase() !== "done";
        });
        const leftBox = document.getElementById("leftover-box");
        leftBox.innerHTML = leftover.length
          ? `<strong>${leftover.length} leftover</strong>` + leftover.map((r) => `<div class="person-row"><div class="person-meta"><strong>${escapeHtml(r.title)}</strong><span class="company-tag">${escapeHtml(String(r.assigned_date || "").slice(0, 10))}</span></div></div>`).join("")
          : `<div class="empty-lite">No leftover tasks. This person is caught up.</div>`;
        const byDay = {};
        personExcelRows.forEach((r) => {
          const d = String(r.assigned_date || "").slice(0, 10);
          if (!d) return;
          if (!byDay[d]) byDay[d] = { given: 0, done: 0 };
          byDay[d].given += 1;
          if (String(r.status).toLowerCase() === "done") byDay[d].done += 1;
        });
        const days = Object.keys(byDay).sort().reverse();
        document.getElementById("history-box").innerHTML = days.length
          ? days.map((d) => `<div class="person-row"><div class="person-meta"><strong>${d}</strong><div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:${Math.round(100 * byDay[d].done / Math.max(1, byDay[d].given))}%"></div></div></div><span>${byDay[d].done}/${byDay[d].given}</span></div>`).join("")
          : `<div class="empty-lite">No dated Excel work yet.</div>`;
      } catch (err) {
        box.innerHTML = `<p class="form-error">${escapeHtml(err.message)}</p>`;
      }
    }

    loadEmployeeMeta().then(() => {
      loadTasks(null);
      loadExcelLists();
    });
  </script>
</body>
</html>
