<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Communities &middot; My Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin-ui.css?v=2">
</head>
<body>
  <div class="mobile-navbar">
    <button class="hamburger-btn" id="mobile-nav-toggle">&#9776;</button>
    <div class="brand">My Management System</div>
    <div style="width:36px;"></div>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-head">
        <div>
          <h1>Communities</h1>
          <p class="page-subtitle">Audiences, students, and followers — copy a link or open the admin.</p>
        </div>
        <button type="button" class="btn btn-primary" id="create-community-btn">+ Create Community</button>
      </div>
      <div id="communities-list" class="company-grid"></div>
      <div id="members-overview" class="hidden"></div>
    </main>
  </div>
  <div class="modal-overlay" id="create-community-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Create Community</h3>
        <button class="modal-close" onclick="closeModal('create-community-modal')">&times;</button>
      </div>
      <form id="create-community-form">
        <div class="form-group">
          <label class="form-label" for="new-community-name">Community name</label>
          <input class="form-control" id="new-community-name" required placeholder="e.g. BuXin Robotics Community">
        </div>
        <div class="form-group">
          <label class="form-label" for="new-community-description">Description</label>
          <textarea class="form-control" id="new-community-description" rows="3" placeholder="What this community is about"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="new-community-image">Community image</label>
          <input class="form-control" id="new-community-image" type="file" accept="image/*" required>
        </div>
        <div class="form-group">
          <label class="form-label">Access</label>
          <select class="form-control" id="new-community-type">
            <option value="free">Free</option>
            <option value="paid">Paid</option>
          </select>
        </div>
        <div id="new-community-paid-fields" class="hidden">
          <div class="form-group">
            <label class="form-label" for="new-community-price">Amount (USD)</label>
            <input class="form-control" id="new-community-price" type="number" min="0" step="0.01" placeholder="e.g. 10.00">
          </div>
          <div class="form-group">
            <label class="form-label" for="new-community-billing">Payment</label>
            <select class="form-control" id="new-community-billing">
              <option value="one_time">One-time payment</option>
              <option value="month">Monthly subscription</option>
            </select>
          </div>
        </div>
        <div class="form-error" id="create-community-error"></div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('create-community-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/common.js?v=3"></script>
  <script src="js/nav-config.js?v=1"></script>
  <script src="js/shell.js?v=2"></script>
  <script src="js/communities.js?v=4"></script>
</body>
</html>
