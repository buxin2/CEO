<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Tasks</title>
  <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>
  <div class="public-page">
    <div class="public-container">
      <div id="page-body">
        <div class="empty-state"><span class="spinner"></span></div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    const TOKEN = getQueryParam("token");
    if (!TOKEN) {
      document.getElementById("page-body").innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">&#128683;</div>
          <p>This task link is invalid or no longer available.</p>
        </div>`;
    } else {
      async function loadPublicTasks() {
        const body = document.getElementById("page-body");
        try {
          const data = await apiRequest(`/api/public/tasks/${TOKEN}`);
          render(data);
        } catch (err) {
          body.innerHTML = `<div class="empty-state"><div class="empty-icon">&#128683;</div><p>${escapeHtml(err.message)}</p></div>`;
        }
      }

      function render(data) {
        const body = document.getElementById("page-body");
        const stats = data.stats;
        const earningsToday = data.earnings_today || { total: 0, records: [] };

        let tasksHtml;
        if (!data.tasks.length) {
          tasksHtml = (data.work_rows && data.work_rows.length)
            ? ""
            : `<div class="empty-state"><p>You don't have any tasks for this week.</p></div>`;
        } else {
          tasksHtml = data.tasks.map(renderTaskCard).join("");
        }

        const groupBtn = data.group_link
          ? `<a class="btn btn-secondary public-group-btn" href="${escapeHtml(data.group_link)}">&#128172; Company Group</a>`
          : "";

        body.innerHTML = `
          <div class="public-header">
            <div class="company-name">${escapeHtml(data.company_name)}</div>
            <div class="employee-name">${escapeHtml(data.employee_name)}</div>
            <div class="week-range">${formatDateRange(data.week.week_start, data.week.week_end)}</div>
            ${groupBtn ? `<div class="public-header-actions">${groupBtn}</div>` : ""}
          </div>
          <div class="public-progress-card">
            <div class="progress-label"><span>${stats.completed} / ${stats.total} completed</span><span>${stats.completion_pct}%</span></div>
            <div class="progress-track"><div class="progress-fill ${stats.completion_pct >= 100 ? "success" : ""}" style="width:${stats.completion_pct}%"></div></div>
          </div>
          <div class="public-earnings-card">
            <h3 class="section-title">Earnings Today</h3>
            <p class="text-muted public-earnings-prompt">How much did you earn for the company today?</p>
            <form id="earnings-form" class="public-earnings-form">
              <input class="form-control" id="earnings-amount" type="number" min="0.01" step="0.01" placeholder="Enter amount" required>
              <button type="submit" class="btn btn-primary">Submit Earnings</button>
            </form>
            <div id="earnings-today-summary" class="public-earnings-summary"></div>
          </div>
          <div id="excel-task-list">${renderWorkRows(data)}</div>
          <div id="task-list">${tasksHtml}</div>
        `;

        renderEarningsSummary(earningsToday);

        document.getElementById("earnings-form").addEventListener("submit", submitEarnings);

        document.querySelectorAll(".task-checkbox-btn").forEach((btn) => {
          btn.addEventListener("click", () => toggleTask(btn.dataset.taskId, btn.dataset.completed === "true"));
        });
        bindWorkRowButtons();
      }

      function renderEarningsSummary(earningsToday) {
        const el = document.getElementById("earnings-today-summary");
        if (!el) return;
        const records = earningsToday.records || [];
        if (!records.length) {
          el.innerHTML = "<p class=\"text-muted\">No earnings submitted today yet.</p>";
          return;
        }
        const rows = records.map((r) =>
          `<div class="earnings-today-row"><span>You</span><span>${formatCurrency(r.amount)}</span></div>`
        ).join("");
        el.innerHTML = `
          ${rows}
          <div class="earnings-today-total"><span>Your total today</span><strong>${formatCurrency(earningsToday.total)}</strong></div>`;
      }

      async function submitEarnings(e) {
        e.preventDefault();
        const input = document.getElementById("earnings-amount");
        const amount = input.value;
        try {
          await apiRequest(`/api/public/tasks/${TOKEN}/earnings`, {
            method: "POST",
            body: JSON.stringify({ amount }),
          });
          input.value = "";
          showToast("Earnings submitted!");
          loadPublicTasks();
        } catch (err) {
          showToast(err.message);
        }
      }

      function skipField(key) {
        const k = String(key || "").trim().toLowerCase();
        return k === "#" || k === "no" || k === "id" || k === "assigned team member";
      }

      function fieldHtml(key, val) {
        const text = String(val || "").trim();
        if (!text) return "";
        const k = String(key || "").toLowerCase();
        let body = escapeHtml(text);
        if (k.indexOf("website") >= 0 || /^https?:\/\//i.test(text)) {
          const href = /^https?:\/\//i.test(text) ? text : "https://" + text;
          body = `<a href="${escapeHtml(href)}" target="_blank" rel="noopener">${escapeHtml(text)}</a>`;
        } else if (k.indexOf("email") >= 0 && text.indexOf("@") >= 0) {
          body = `<a href="mailto:${escapeHtml(text)}">${escapeHtml(text)}</a>`;
        }
        return `<div class="work-row-field"><label>${escapeHtml(key)}</label><div>${body}</div></div>`;
      }

      function renderWorkRows(data) {
        const rows = data.work_rows || [];
        if (!rows.length) return "";
        const lists = data.work_lists || [];
        const quota = lists[0] ? lists[0].daily_quota : 5;
        const todayCount = rows.filter((r) => r.assigned_date === data.today).length;
        return `
          <h3 class="section-title" style="margin:20px 0 8px;">Today's Excel tasks</h3>
          <p class="text-muted">${todayCount} new today (up to ${quota} per day). Open each row, do the work, write notes, then mark done.</p>
          ${rows.map((r) => {
            const fields = Object.keys(r.fields || {}).map((k) => skipField(k) ? "" : fieldHtml(k, r.fields[k])).join("");
            return `
            <div class="work-row-card ${r.status === "done" ? "done" : ""}">
              <div class="work-row-head">
                <strong>#${r.row_number} ${escapeHtml(r.title)}</strong>
                <span class="badge">${r.assigned_date === data.today ? "Today" : escapeHtml(r.assigned_date || "")}</span>
              </div>
              <div class="work-row-fields">${fields}</div>
              <label class="form-label" style="margin-top:12px;">Notes of what you did</label>
              <textarea class="form-control" id="work-notes-${r.id}" rows="2" placeholder="Write what you completed">${escapeHtml(r.notes || "")}</textarea>
              <div class="flex gap-8" style="margin-top:8px;">
                <button type="button" class="btn btn-secondary btn-sm" data-save-work="${r.id}">Save notes</button>
                <button type="button" class="btn btn-primary btn-sm" data-done-work="${r.id}" data-status="${r.status}">${r.status === "done" ? "Undo done" : "Mark done"}</button>
              </div>
            </div>`;
          }).join("")}`;
      }

      function bindWorkRowButtons() {
        document.querySelectorAll("[data-save-work]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.getAttribute("data-save-work");
            const notes = (document.getElementById("work-notes-" + id) || {}).value || "";
            try {
              await apiRequest(`/api/public/tasks/${TOKEN}/work-rows/${id}`, {
                method: "PUT",
                body: JSON.stringify({ notes }),
              });
              showToast("Notes saved");
            } catch (err) {
              showToast(err.message);
            }
          });
        });
        document.querySelectorAll("[data-done-work]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.getAttribute("data-done-work");
            const cur = btn.getAttribute("data-status");
            const notes = (document.getElementById("work-notes-" + id) || {}).value || "";
            try {
              await apiRequest(`/api/public/tasks/${TOKEN}/work-rows/${id}`, {
                method: "PUT",
                body: JSON.stringify({ notes, status: cur === "done" ? "pending" : "done" }),
              });
              loadPublicTasks();
            } catch (err) {
              showToast(err.message);
            }
          });
        });
      }

      function renderTaskCard(t) {
        const isCompleted = t.status === "completed";
        const dueLabel = t.due_date ? formatShortDate(t.due_date) : "No due date";
        return `
          <div class="public-task-card ${isCompleted ? "completed" : ""}">
            <button class="task-checkbox-btn ${isCompleted ? "checked" : ""}" data-task-id="${t.id}" data-completed="${isCompleted}">
              ${isCompleted ? "&#10003;" : ""}
            </button>
            <div class="public-task-body">
              <div class="public-task-title ${isCompleted ? "completed" : ""}">${escapeHtml(t.title)}</div>
              <div class="public-task-meta">
                <span class="badge badge-priority-${t.priority}">${t.priority}</span>
                <span class="badge badge-status-${t.status}">${isCompleted ? "Completed" : "Due: " + dueLabel}</span>
              </div>
              ${t.description ? `<div class="public-task-desc">${escapeHtml(t.description)}</div>` : ""}
            </div>
          </div>`;
      }

      async function toggleTask(taskId, isCurrentlyCompleted) {
        const action = isCurrentlyCompleted ? "uncomplete" : "complete";
        try {
          await apiRequest(`/api/public/tasks/${TOKEN}/${taskId}/${action}`, { method: "POST" });
          loadPublicTasks();
        } catch (err) {
          showToast(err.message);
        }
      }

      loadPublicTasks();
    }
  </script>
</body>
</html>
