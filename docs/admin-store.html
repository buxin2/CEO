<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products · Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="mobile-navbar">
    <button class="hamburger-btn" id="mobile-nav-toggle">&#9776;</button>
    <div class="brand">Products</div>
    <div style="width:36px;"></div>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">My Management System</div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="dashboard.html">Dashboard</a>
        <a class="sidebar-link" href="communities.html">Communities</a>
        <a class="sidebar-link active" href="admin-store.html">Products</a>
        <a class="sidebar-link" href="admin-shipping.html">Shipping</a>
        <a class="sidebar-link" href="admin-store-orders.html">Store Orders</a>
        <a class="sidebar-link" href="payments.html">Payments</a>
        <a class="sidebar-link" href="ai-assistant.html">AI Assistant</a>
        <a class="sidebar-link" href="ideas.html">My Ideas</a>
      </nav>
      <button class="sidebar-link" id="logout-btn">Logout</button>
    </aside>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Products</h1>
          <div class="page-subtitle">Create product pages, copy links, and manage inventory.</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-secondary" id="copy-store-link">Copy Store Link</button>
          <button class="btn btn-primary" id="add-product-btn">+ Add Product</button>
        </div>
      </div>
      <div class="summary-grid" id="store-stats"></div>
      <div class="card" style="margin:16px 0;padding:16px;">
        <h3>Store branding</h3>
        <div class="form-grid admin-product-form" style="margin-top:8px;">
          <div class="form-group"><label class="form-label">Store name</label><input class="form-control" id="set-name"></div>
          <div class="form-group"><label class="form-label">Tagline</label><input class="form-control" id="set-tagline"></div>
          <div class="form-group"><label class="form-label">Default currency</label><input class="form-control" id="set-currency" placeholder="USD"></div>
          <div class="form-group"><label class="form-label">Free shipping above (cents, optional)</label><input class="form-control" id="set-free-min" type="number"></div>
        </div>
        <button class="btn btn-secondary" id="save-settings">Save store settings</button>
      </div>
      <div class="card" style="margin-bottom:16px;padding:16px;">
        <h3>Categories</h3>
        <div id="cat-list"></div>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <input class="form-control" id="new-cat" placeholder="New category name">
          <button class="btn btn-secondary" id="add-cat">Add</button>
        </div>
      </div>
      <div id="product-list"></div>
    </main>
  </div>

  <div class="modal-overlay" id="product-modal">
    <div class="modal" style="max-width:760px;max-height:90vh;overflow:auto;">
      <div class="modal-header">
        <h3 id="product-modal-title">Add product</h3>
        <button class="modal-close" onclick="closeModal('product-modal')">&times;</button>
      </div>
      <form id="product-form" class="admin-product-form">
        <input type="hidden" id="p-id">
        <div class="form-grid">
          <div class="form-group"><label class="form-label">Title</label><input class="form-control" id="p-title" required></div>
          <div class="form-group"><label class="form-label">SKU</label><input class="form-control" id="p-sku"></div>
          <div class="form-group"><label class="form-label">Category</label><select class="form-control" id="p-category"></select></div>
          <div class="form-group"><label class="form-label">Status</label>
            <select class="form-control" id="p-status">
              <option value="draft">Draft</option>
              <option value="active">Active (published)</option>
              <option value="hidden">Hidden</option>
              <option value="out_of_stock">Out of stock</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label">Type</label>
            <select class="form-control" id="p-type"><option value="physical">Physical</option><option value="digital">Digital</option></select>
          </div>
          <div class="form-group"><label class="form-label">Currency</label><input class="form-control" id="p-currency" value="USD"></div>
          <div class="form-group"><label class="form-label">Price</label><input class="form-control" id="p-price" placeholder="250"></div>
          <div class="form-group"><label class="form-label">Sale price (optional)</label><input class="form-control" id="p-sale"></div>
          <div class="form-group"><label class="form-label">Stock quantity (blank = unlimited)</label><input class="form-control" id="p-qty" type="number"></div>
          <div class="form-group"><label class="form-label">Keywords</label><input class="form-control" id="p-keywords"></div>
        </div>
        <div class="form-group"><label class="form-label">Short description</label><input class="form-control" id="p-short"></div>
        <div class="form-group"><label class="form-label">Description (HTML allowed)</label><textarea class="form-control" id="p-desc" rows="6"></textarea></div>
        <div class="form-group"><label class="form-label">Specifications (HTML allowed)</label><textarea class="form-control" id="p-specs" rows="3"></textarea></div>
        <div class="form-group">
          <label><input type="checkbox" id="p-ship"> Shipping required</label>
          <label style="margin-left:12px;"><input type="checkbox" id="p-free-ship"> Free shipping on this product</label>
        </div>
        <div class="form-group"><label class="form-label">Digital access URL</label><input class="form-control" id="p-dig-url"></div>
        <div class="form-group"><label class="form-label">Digital access instructions</label><textarea class="form-control" id="p-dig-text"></textarea></div>
        <div class="form-group"><label class="form-label">Variations JSON (optional)</label>
          <textarea class="form-control" id="p-options" rows="4" placeholder='[{"name":"Color","values":["Black","White"]},{"name":"Size","values":["S","M","L"]}]'></textarea>
        </div>
        <div class="form-group"><label class="form-label">Related product IDs (comma separated)</label><input class="form-control" id="p-related"></div>
        <div class="form-group">
          <label class="form-label">Add image URL</label>
          <div style="display:flex;gap:8px;"><input class="form-control" id="p-image-url"><button type="button" class="btn btn-secondary" id="add-image-url">Add URL</button></div>
          <input type="file" id="p-image-file" accept="image/*" style="margin-top:8px;">
        </div>
        <div class="media-thumb-row" id="p-images"></div>
        <div class="form-group">
          <label class="form-label">Add YouTube / video URL</label>
          <div style="display:flex;gap:8px;"><input class="form-control" id="p-video-url" placeholder="https://youtube.com/watch?v=..."><button type="button" class="btn btn-secondary" id="add-video-url">Add video</button></div>
          <input type="file" id="p-video-file" accept="video/mp4,video/webm,video/quicktime" style="margin-top:8px;">
        </div>
        <div id="p-videos"></div>
        <div class="form-error" id="product-form-error"></div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('product-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin-store.js?v=1"></script>
</body>
</html>
