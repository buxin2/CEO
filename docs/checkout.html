<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join class</title>
  <link rel="stylesheet" href="css/style.css?v=11">
</head>
<body class="group-page-body">
  <div class="group-entry" style="max-width:560px;margin:40px auto;">
    <div class="group-entry-card class-pay-card" style="max-width:560px;">
      <div id="class-hero"></div>
      <div class="class-pay-body">
        <h1 id="checkout-title">Checkout</h1>
        <div id="checkout-error" class="form-error hidden"></div>
        <div id="checkout-auth" class="hidden">
          <p class="class-pay-lead">Sign in with Google first. Then you can enroll and enter the class.</p>
          <div class="google-signin-wrap"><div id="checkout-google-btn"></div></div>
          <div class="auth-or"><span>or use email</span></div>
          <div class="form-group"><input class="form-control" id="chk-login-email" type="email" placeholder="Email" autocomplete="email"></div>
          <div class="form-group"><input class="form-control" id="chk-login-pass" type="password" placeholder="Password" autocomplete="current-password"></div>
          <button type="button" class="btn btn-primary btn-block" id="chk-login-btn">Sign in</button>
        </div>
        <div id="checkout-loading" class="text-muted">Loading…</div>
        <div id="checkout-form" class="hidden">
          <div id="checkout-summary" class="card card-inner" style="margin-bottom:16px;"></div>
          <div class="form-group">
            <label class="form-label">Coupon code</label>
            <input class="form-control" id="coupon-code" placeholder="Optional">
            <button type="button" class="btn btn-secondary btn-sm" id="apply-coupon-btn" style="margin-top:6px;">Apply</button>
          </div>
          <div class="form-group">
            <label class="form-label">Full name</label>
            <input class="form-control" id="customer-name">
          </div>
          <div class="form-group">
            <label class="form-label">Phone</label>
            <input class="form-control" id="customer-phone">
          </div>
          <div class="form-group">
            <label class="form-label">Payment</label>
            <div id="payment-methods"></div>
          </div>
          <div id="paypal-box" class="hidden">
            <div id="paypal-button-container"></div>
          </div>
          <div id="manual-instructions" class="hidden card card-inner" style="margin-top:12px;"></div>
          <div id="delivery-section" class="hidden">
            <h3>Delivery information</h3>
            <input class="form-control" id="del-name" placeholder="Full name" style="margin-bottom:6px;">
            <input class="form-control" id="del-phone" placeholder="Phone" style="margin-bottom:6px;">
            <input class="form-control" id="del-country" placeholder="Country" style="margin-bottom:6px;">
            <input class="form-control" id="del-city" placeholder="City" style="margin-bottom:6px;">
            <input class="form-control" id="del-address" placeholder="Address" style="margin-bottom:6px;">
            <input class="form-control" id="del-postal" placeholder="Postal / ZIP">
          </div>
          <button type="button" class="btn btn-primary btn-block hidden" id="pay-btn" style="margin-top:16px;">Enroll</button>
          <div id="receipt-section" class="hidden" style="margin-top:16px;">
            <label class="form-label">Upload payment receipt</label>
            <input type="file" id="receipt-file" accept="image/*">
            <button type="button" class="btn btn-secondary btn-block" id="submit-receipt-btn" style="margin-top:8px;">Submit receipt</button>
          </div>
        </div>
        <div id="checkout-success" class="hidden">
          <h2>You're enrolled</h2>
          <p id="success-message"></p>
          <a class="btn btn-primary" id="success-continue" href="#">Enter the class</a>
        </div>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/store-cart.js?v=6"></script>
  <script src="js/paypal-buttons.js?v=1"></script>
  <script src="js/checkout.js?v=10"></script>
</body>
</html>
