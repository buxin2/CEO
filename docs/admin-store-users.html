<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Users · Admin</title>
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <div class="mobile-navbar">
    <button class="hamburger-btn" id="mobile-nav-toggle">&#9776;</button>
    <div class="brand">Store Users</div>
    <div style="width:36px;"></div>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">My Management System</div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="dashboard.html">Dashboard</a>
        <a class="sidebar-link" href="admin-store.html">Products</a>
        <a class="sidebar-link" href="admin-shipping.html">Shipping</a>
        <a class="sidebar-link" href="admin-store-orders.html">Store Orders</a>
        <a class="sidebar-link active" href="admin-store-users.html">Store Users</a>
        <a class="sidebar-link" href="payments.html">Payments</a>
        <a class="sidebar-link" href="orders.html">Community Orders</a>
        <a class="sidebar-link" href="ai-assistant.html">AI Assistant</a>
      </nav>
      <button class="sidebar-link" id="logout-btn">Logout</button>
    </aside>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Store Users</h1>
          <div class="page-subtitle">See accounts, emails, and set a new password when someone forgets theirs.</div>
        </div>
      </div>
      <div class="card" style="padding:12px;margin-bottom:16px;">
        <input class="form-control" id="user-search" placeholder="Search name, email, or phone">
      </div>
      <div id="users-list"></div>
    </main>
  </div>

  <div class="modal-overlay" id="user-modal">
    <div class="modal" style="max-width:720px;max-height:90vh;overflow:auto;">
      <div class="modal-header">
        <h3 id="user-modal-title">User</h3>
        <button class="modal-close" type="button" onclick="closeModal('user-modal')">&times;</button>
      </div>
      <div id="user-modal-body" style="padding:16px;"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin-store-users.js?v=1"></script>
</body>
</html>
