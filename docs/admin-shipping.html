<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping · Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="mobile-navbar">
    <button class="hamburger-btn" id="mobile-nav-toggle">&#9776;</button>
    <div class="brand">Shipping</div>
    <div style="width:36px;"></div>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">My Management System</div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" href="dashboard.html">Dashboard</a>
        <a class="sidebar-link" href="admin-store.html">Products</a>
        <a class="sidebar-link active" href="admin-shipping.html">Shipping</a>
        <a class="sidebar-link" href="admin-store-orders.html">Store Orders</a>
        <a class="sidebar-link" href="payments.html">Payments</a>
        <a class="sidebar-link" href="ai-assistant.html">AI Assistant</a>
      </nav>
      <button class="sidebar-link" id="logout-btn">Logout</button>
    </aside>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Shipping Management</h1>
          <div class="page-subtitle">Only enabled countries can receive orders. Regional rates override the country default.</div>
        </div>
      </div>
      <div class="card" style="padding:16px;margin-bottom:16px;">
        <h3>Add country</h3>
        <div class="form-grid admin-product-form">
          <div class="form-group"><label class="form-label">Country</label><input class="form-control" id="c-name" placeholder="India"></div>
          <div class="form-group"><label class="form-label">Code</label><input class="form-control" id="c-code" placeholder="IN"></div>
          <div class="form-group"><label class="form-label">Shipping rate</label><input class="form-control" id="c-rate" placeholder="10"></div>
          <div class="form-group"><label class="form-label">Currency</label><input class="form-control" id="c-cur" value="USD"></div>
        </div>
        <label><input type="checkbox" id="c-enabled" checked> Delivery enabled</label>
        <label style="margin-left:12px;"><input type="checkbox" id="c-free"> Free shipping</label>
        <div class="form-group" style="margin-top:8px;max-width:280px;">
          <label class="form-label">Free shipping minimum (optional amount)</label>
          <input class="form-control" id="c-free-min" placeholder="100">
        </div>
        <button class="btn btn-primary" id="add-country">Add country</button>
      </div>
      <div id="country-list"></div>
    </main>
  </div>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin-shipping.js?v=1"></script>
</body>
</html>
