<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &middot; My Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">My Management System</div>
      <div class="login-subtitle">Sign in to manage your companies</div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="form-error" id="login-error"></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Login</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");
    const loginBtn = document.getElementById("login-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("visible");
      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const data = await apiRequest("/api/login", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });
        window.location.href = data.redirect || pageUrl("dashboard.html");
      } catch (err) {
        errorBox.textContent = err.message || "Invalid email or password.";
        errorBox.classList.add("visible");
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
